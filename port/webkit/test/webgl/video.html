<!doctype html>
<!-- WebGL M3 check (spikes/11-webgl): video frames into a WebGL texture.
     A synthetic clip (test/media/make-media.sh: testsrc2 with a running
     clock), played by a <video> that is not in the page (as three.js
     players do), is uploaded with texImage2D(video) every animation frame
     (UNPACK_FLIP_Y on, as three.js) and drawn on a slowly turning quad in a
     WebGL 2 canvas (?gl=1: WebGL 1, as many 360 and VR video players are;
     its copy path differs on GPU=radv). On the TV: the test pattern, the
     right way up, its clock running, on a tilted quad; the text under it
     gives the frame rate and the centre pixel. Upload to
     /data/ps5webkit/webgl-video.html and open
     file:///data/ps5webkit/webgl-video.html[?clip=sync-2160p30-hevc.mp4 or an absolute path][&attach=1][&gl=1]. -->
<html>
<head>
<meta charset="utf-8">
<title>WebGL video</title>
<style>
  body { background: #111; color: #eee; font: 28px/1.4 sans-serif; margin: 40px; }
  canvas { width: 1280px; height: 720px; border: 2px solid #555; }
  #out { white-space: pre; }
</style>
</head>
<body>
<h1>WebGL video</h1>
<canvas id="c" width="1280" height="720"></canvas>
<div id="out">starting</div>
<script>
const out = document.getElementById('out');
function log(text) { console.log('[webgl-video] ' + text); }

const clip = new URLSearchParams(location.search).get('clip') || 'sync-1080p30-h264.mp4';
const video = document.createElement('video');
video.src = clip.startsWith('/') ? clip : '/data/ps5webkit/media/' + clip;
video.muted = true;
video.loop = true;
video.playsInline = true;
// ?attach=1: the <video> in the page too (small, top right), as some players do.
if (new URLSearchParams(location.search).get('attach')) {
  video.style.cssText = 'position: fixed; top: 16px; right: 16px; width: 320px; height: 180px;';
  document.body.appendChild(video);
}
['emptied', 'suspend', 'stalled', 'waiting', 'pause', 'ended', 'error'].forEach(e => video.addEventListener(e, () => log('video event ' + e + ' at ' + video.currentTime.toFixed(2) + ' s, readyState ' + video.readyState + (video.error ? ', error ' + video.error.code : ''))));
video.play().then(() => log('playing ' + clip), err => log('play failed: ' + err));

const webGL1 = new URLSearchParams(location.search).get('gl') === '1';
const gl = document.getElementById('c').getContext(webGL1 ? 'webgl' : 'webgl2', { antialias: false });
log('WebGL ' + (webGL1 ? 1 : 2));
// GLSL ES 1.00 for WebGL 1: the same shaders with its keywords.
const glsl = source => webGL1 ? source.replace('#version 300 es\n', '').replace(/\bin vec2 p;/, 'attribute vec2 p;')
  .replace(/\bout vec2 uv;/, 'varying vec2 uv;').replace(/\bin vec2 uv;/, 'varying vec2 uv;').replace(/ out vec4 o;/, '')
  .replace('o = texture(t, uv);', 'gl_FragColor = texture2D(t, uv);') : source;
const vs = gl.createShader(gl.VERTEX_SHADER);
gl.shaderSource(vs, glsl(`#version 300 es
in vec2 p; out vec2 uv; uniform float a;
void main() {
  uv = p * 0.5 + 0.5;
  float c = cos(a), s = sin(a);
  vec2 q = vec2(c * p.x - s * p.y, s * p.x + c * p.y) * 0.8;
  gl_Position = vec4(q, 0.0, 1.0);
}`));
gl.compileShader(vs);
const fs = gl.createShader(gl.FRAGMENT_SHADER);
gl.shaderSource(fs, glsl(`#version 300 es
precision mediump float; in vec2 uv; uniform sampler2D t; out vec4 o;
void main() { o = texture(t, uv); }`));
gl.compileShader(fs);
const prog = gl.createProgram();
gl.attachShader(prog, vs); gl.attachShader(prog, fs);
gl.bindAttribLocation(prog, 0, 'p');
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
  log('link failed: ' + gl.getProgramInfoLog(prog) + gl.getShaderInfoLog(vs) + gl.getShaderInfoLog(fs));
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const angle = gl.getUniformLocation(prog, 'a');
const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

let frames = 0, uploads = 0, last = performance.now(), t0 = last;
function frame(now) {
  if (video.readyState >= video.HAVE_CURRENT_DATA) {
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
    uploads++;
  }
  gl.clearColor(0.1, 0.1, 0.15, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform1f(angle, Math.sin((now - t0) / 3000) * 0.25);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  frames++;
  if (now - last >= 2000) {
    const px = new Uint8Array(4);
    gl.readPixels(640, 360, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    out.textContent = (frames * 1000 / (now - last)).toFixed(1) + ' fps, ' + uploads + ' uploads, video ' + video.videoWidth + 'x' + video.videoHeight +
      ' at ' + video.currentTime.toFixed(1) + ' s, centre pixel ' + Array.from(px).join(',') + ', GL error 0x' + gl.getError().toString(16);
    log(out.textContent);
    frames = 0; uploads = 0; last = now;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
