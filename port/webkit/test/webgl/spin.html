<!doctype html>
<!-- WebGL M2 check (spikes/11-webgl): a spinning triangle, redrawn every
     animation frame, in a WebGL 2 canvas (left) and a WebGL 1 canvas
     (right), with the frame rate written under them. On the TV: both
     canvases show a turning triangle (green on dark blue, and orange on
     dark red), the text reads about 60 fps. Upload to
     /data/ps5webkit/spin.html and open file:///data/ps5webkit/spin.html. -->
<html>
<head>
<meta charset="utf-8">
<title>WebGL spin</title>
<style>
  body { background: #111; color: #eee; font: 28px/1.4 sans-serif; margin: 40px; }
  canvas { width: 480px; height: 480px; border: 2px solid #555; margin-right: 24px; }
  #out { white-space: pre; }
</style>
</head>
<body>
<h1>WebGL spin</h1>
<canvas id="c2" width="480" height="480"></canvas><canvas id="c1" width="480" height="480"></canvas>
<div id="out">starting</div>
<script>
const out = document.getElementById('out');
function log(text) { console.log('[webgl-spin] ' + text); }

function setup(id, kind, clear, color) {
  const gl = document.getElementById(id).getContext(kind, { antialias: false });
  if (!gl) { log(kind + ': no context'); return null; }
  const vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, 'attribute vec2 p; uniform float a; void main() {' +
    ' float c = cos(a), s = sin(a); gl_Position = vec4(c * p.x - s * p.y, s * p.x + c * p.y, 0.0, 1.0); }');
  gl.compileShader(vs);
  const fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, 'precision mediump float; uniform vec4 col; void main() { gl_FragColor = col; }');
  gl.compileShader(fs);
  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs);
  gl.bindAttribLocation(prog, 0, 'p');
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { log(kind + ': link failed'); return null; }
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0.8, -0.7, -0.5, 0.7, -0.5]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.useProgram(prog);
  const angle = gl.getUniformLocation(prog, 'a');
  gl.uniform4fv(gl.getUniformLocation(prog, 'col'), color);
  log(kind + ': ' + gl.getParameter(gl.VERSION));
  return { gl, angle, clear, speed: kind === 'webgl2' ? 1 : -1 };
}

const scenes = [
  setup('c2', 'webgl2', [0.05, 0.08, 0.25, 1], [0.2, 0.9, 0.3, 1]),
  setup('c1', 'webgl', [0.25, 0.05, 0.05, 1], [1.0, 0.6, 0.1, 1]),
].filter(Boolean);

let frames = 0, last = performance.now(), t0 = last;
function frame(now) {
  const t = (now - t0) / 1000;
  for (const s of scenes) {
    const gl = s.gl;
    gl.clearColor(...s.clear);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(s.angle, s.speed * t * 1.5);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  frames++;
  if (now - last >= 1000) {
    const fps = frames * 1000 / (now - last);
    out.textContent = scenes.length + ' contexts, ' + fps.toFixed(1) + ' fps';
    log(out.textContent);
    frames = 0; last = now;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
