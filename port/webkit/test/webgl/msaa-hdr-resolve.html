<!doctype html>
<!-- WebGL 2 check (ps5-opengl: 4x MSAA RGBA16F resolves on the GPU): an HDR
     4x multisampled RGBA16F renderbuffer, cleared to (2, 0.5, 0.25, 1) with a
     triangle of (0, 4, 0, 1) drawn over it, resolved by blitFramebuffer into
     an RGBA16F texture and read back as floats. Inside and outside the
     triangle must be exact; an edge pixel must be a mix of the two with a
     weight of 0, 1/4, 1/2, 3/4 or 1 (its covered samples), the same for every
     channel. Then ?n=<resolves> (default 60) resolves are timed.
       RESULT msaa-hdr-resolve PASS|FAIL <w>x<h>: <inside>/<outside>/<edge>
       pixels, <bad> wrong; <ms> ms per resolve
     ?w=&h= set the size (default 1396x734, a game's canvas). Upload to
     /data/ps5webkit/webgl-msaa-hdr-resolve.html and open
     file:///data/ps5webkit/webgl-msaa-hdr-resolve.html. -->
<html>
<head>
<meta charset="utf-8">
<title>WebGL HDR MSAA resolve</title>
<style>
  body { background: #111; color: #eee; font: 24px/1.4 sans-serif; margin: 40px; }
  #out { white-space: pre; }
</style>
</head>
<body>
<h1>WebGL HDR MSAA resolve</h1>
<div id="out">starting</div>
<script>
const params = new URLSearchParams(location.search);
const W = parseInt(params.get('w') || '1396', 10), H = parseInt(params.get('h') || '734', 10);
const N = parseInt(params.get('n') || '60', 10);
const out = document.getElementById('out');
function log(text) { console.log('[msaa-hdr-resolve] ' + text); out.textContent = text; }

function run() {
  const canvas = document.createElement('canvas');
  const gl = canvas.getContext('webgl2', { antialias: false });
  if (!gl)
    return 'RESULT msaa-hdr-resolve FAIL no WebGL 2';
  if (!gl.getExtension('EXT_color_buffer_float'))
    return 'RESULT msaa-hdr-resolve FAIL no EXT_color_buffer_float';
  if (gl.getInternalformatParameter(gl.RENDERBUFFER, gl.RGBA16F, gl.SAMPLES).indexOf(4) < 0)
    return 'RESULT msaa-hdr-resolve FAIL RGBA16F has no 4x MSAA';

  const msaa = gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER, msaa);
  gl.renderbufferStorageMultisample(gl.RENDERBUFFER, 4, gl.RGBA16F, W, H);
  const msaaFB = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, msaaFB);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, msaa);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE)
    return 'RESULT msaa-hdr-resolve FAIL multisampled framebuffer incomplete';

  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA16F, W, H);
  const resolveFB = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, resolveFB);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE)
    return 'RESULT msaa-hdr-resolve FAIL resolve framebuffer incomplete';

  const program = gl.createProgram();
  for (const [type, source] of [[gl.VERTEX_SHADER, `#version 300 es
in vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }`], [gl.FRAGMENT_SHADER, `#version 300 es
precision highp float; out vec4 o; void main() { o = vec4(0.0, 4.0, 0.0, 1.0); }`]]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
      return 'RESULT msaa-hdr-resolve FAIL shader: ' + gl.getShaderInfoLog(s);
    gl.attachShader(program, s);
  }
  gl.bindAttribLocation(program, 0, 'p');
  gl.linkProgram(program);
  gl.useProgram(program);
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  // A slanted triangle: its long edge crosses pixels at every coverage.
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.9, -0.85, 0.83, -0.9, -0.2, 0.87]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  function drawAndResolve() {
    gl.bindFramebuffer(gl.FRAMEBUFFER, msaaFB);
    gl.viewport(0, 0, W, H);
    gl.clearColor(2.0, 0.5, 0.25, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, msaaFB);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, resolveFB);
    gl.blitFramebuffer(0, 0, W, H, 0, 0, W, H, gl.COLOR_BUFFER_BIT, gl.NEAREST);
  }

  drawAndResolve();
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, resolveFB);
  const pixels = new Float32Array(W * H * 4);
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.FLOAT, pixels);
  const error = gl.getError();
  if (error)
    return 'RESULT msaa-hdr-resolve FAIL GL error 0x' + error.toString(16);

  const clear = [2.0, 0.5, 0.25, 1.0], tri = [0.0, 4.0, 0.0, 1.0];
  let inside = 0, outside = 0, edge = 0, bad = 0, firstBad = '';
  for (let i = 0; i < W * H; i++) {
    const px = pixels.subarray(i * 4, i * 4 + 4);
    // The weight from green (0.5 -> 4.0), then every channel must agree.
    const w = (px[1] - clear[1]) / (tri[1] - clear[1]);
    const q = Math.round(w * 4) / 4;
    let ok = Math.abs(w - q) < 0.01 && q >= 0 && q <= 1;
    for (let c = 0; ok && c < 4; c++)
      ok = Math.abs(px[c] - (clear[c] * (1 - q) + tri[c] * q)) < 0.01;
    if (!ok) {
      if (!bad)
        firstBad = ' first at (' + (i % W) + ',' + Math.floor(i / W) + '): ' + Array.from(px).map(v => v.toFixed(3)).join(',');
      bad++;
    } else if (q === 0)
      outside++;
    else if (q === 1)
      inside++;
    else
      edge++;
  }

  const t0 = performance.now();
  for (let k = 0; k < N; k++)
    drawAndResolve();
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, resolveFB);
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, new Float32Array(4));
  const ms = (performance.now() - t0) / N;

  const pass = !bad && inside > 0 && outside > 0 && edge > 0;
  return 'RESULT msaa-hdr-resolve ' + (pass ? 'PASS' : 'FAIL') + ' ' + W + 'x' + H + ': ' + inside + '/' + outside + '/' + edge +
      ' inside/outside/edge pixels, ' + bad + ' wrong' + firstBad + '; ' + ms.toFixed(2) + ' ms per draw+resolve (' + N + ')';
}
setTimeout(() => {
  try { log(run()); } catch (e) { log('RESULT msaa-hdr-resolve FAIL exception ' + e); }
}, 500);
</script>
</body>
</html>
