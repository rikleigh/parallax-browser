<!doctype html>
<!-- WebGPU rendering with no canvas: everything is drawn into textures and
     read back with copyTextureToBuffer and mapAsync, so the results don't
     depend on how a canvas reaches the screen. Cases: triangle: a red
     triangle on blue in a 256x256 rgba8unorm texture, centre and corner
     checked; msaa-resolve: the same with a 4x multisampled target resolved
     into the texture (the edge must have blended pixels); depth: a near
     green quad over the left half drawn before a far red one over
     everything, with a depth24plus buffer (the left stays green);
     write-texture-sample: a 4x4 texture filled by writeTexture and drawn
     with a nearest sampler onto a full quad; write-buffer-copy: writeBuffer
     (also with a data offset and size) and copyBufferToBuffer between
     offsets; rgba16float: values outside 0..1 survive in a float target;
     mip-levels: each level of a 3-level texture rendered through its own
     view and read back at its own size, and a view of level 2 alone
     sampled. Log lines: RESULT webgpu-offscreen-readback <case> PASS|FAIL
     <why>, then RESULT webgpu-offscreen-readback summary PASS|FAIL <n>/<m>.
     Upload the directory to /data/ps5webkit/webgpu/ and open
     file:///data/ps5webkit/webgpu/offscreen-readback.html. -->
<html>
<head>
<meta charset="utf-8">
<title>WebGPU offscreen readback</title>
<style>
  body { background: #111; color: #eee; font: 22px/1.35 sans-serif; margin: 40px; }
  #out { white-space: pre-wrap; overflow-wrap: anywhere; }
  .fail { color: #f66; } .skip { color: #fc6; } .info { color: #999; }
</style>
</head>
<body>
<h1>WebGPU offscreen readback</h1>
<div id="out"></div>
<script src="webgpu-test.js"></script>
<script>
const SIZE = 256;

// Position and colour per vertex.
const COLOURED = `
struct V { @builtin(position) position: vec4f, @location(0) colour: vec4f }
@vertex fn vs(@location(0) position: vec3f, @location(1) colour: vec4f) -> V {
  return V(vec4f(position, 1.0), colour);
}
@fragment fn fs(v: V) -> @location(0) vec4f {
  return v.colour;
}`;

// A quad over the whole target showing a texture upright (its first row at the top).
const TEXTURED = `
@group(0) @binding(0) var s: sampler;
@group(0) @binding(1) var t: texture_2d<f32>;
struct V { @builtin(position) position: vec4f, @location(0) uv: vec2f }
@vertex fn vs(@builtin(vertex_index) i: u32) -> V {
  var corners = array<vec2f, 6>(vec2f(-1.0, -1.0), vec2f(1.0, -1.0), vec2f(-1.0, 1.0),
                                vec2f(-1.0, 1.0), vec2f(1.0, -1.0), vec2f(1.0, 1.0));
  let xy = corners[i];
  return V(vec4f(xy, 0.0, 1.0), vec2f(xy.x * 0.5 + 0.5, 0.5 - xy.y * 0.5));
}
@fragment fn fs(v: V) -> @location(0) vec4f {
  return textureSample(t, s, v.uv);
}`;

const RED = [1, 0, 0, 1], GREEN = [0, 1, 0, 1], BLUE = [0, 0, 1, 1];
const TRIANGLE = [[0, 0.8, 0], [-0.8, -0.8, 0], [0.8, -0.8, 0]];

function vertices(positions, colour) {
  const data = [];
  for (const p of positions) data.push(...p, ...colour);
  return data;
}
function quad(x0, x1, z, colour) {
  return vertices([[x0, -1, z], [x1, -1, z], [x0, 1, z], [x0, 1, z], [x1, -1, z], [x1, 1, z]], colour);
}

T.run('offscreen-readback', async () => {
  const g = await T.getDevice();
  if (!g) return;
  const { device } = g;
  const TARGET = GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC;

  const colouredModule = device.createShaderModule({ code: COLOURED });
  function colouredPipeline(format, sampleCount, depth) {
    return device.createRenderPipeline({
      layout: 'auto',
      vertex: {
        module: colouredModule, entryPoint: 'vs',
        buffers: [{ arrayStride: 28, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }, { shaderLocation: 1, offset: 12, format: 'float32x4' }] }],
      },
      fragment: { module: colouredModule, entryPoint: 'fs', targets: [{ format }] },
      primitive: { topology: 'triangle-list' },
      multisample: { count: sampleCount },
      depthStencil: depth ? { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less' } : undefined,
    });
  }
  function vertexBuffer(data) {
    const buffer = device.createBuffer({ size: data.length * 4, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(buffer, 0, new Float32Array(data));
    return buffer;
  }
  // One pass: clear, then draw the vertex data with the pipeline.
  function draw(pipeline, data, colorAttachment, depthView) {
    const buffer = vertexBuffer(data);
    const encoder = device.createCommandEncoder();
    const pass = encoder.beginRenderPass({
      colorAttachments: [Object.assign({ loadOp: 'clear', storeOp: 'store' }, colorAttachment)],
      depthStencilAttachment: depthView ? { view: depthView, depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'store' } : undefined,
    });
    pass.setPipeline(pipeline);
    pass.setVertexBuffer(0, buffer);
    pass.draw(data.length / 7);
    pass.end();
    device.queue.submit([encoder.finish()]);
    buffer.destroy();
  }

  await T.test('triangle', async () => {
    const texture = device.createTexture({ size: [SIZE, SIZE], format: 'rgba8unorm', usage: TARGET });
    draw(colouredPipeline('rgba8unorm', 1), vertices(TRIANGLE, RED), { view: texture.createView(), clearValue: BLUE });
    const image = await T.readTexture(device, texture);
    T.expectPixel(image, SIZE / 2, SIZE / 2, [255, 0, 0, 255], 'centre');
    T.expectPixel(image, 2, 2, [0, 0, 255, 255], 'corner');
    T.expectPixel(image, SIZE - 3, SIZE - 3, [0, 0, 255, 255], 'far corner');
    T.expectPixel(image, SIZE / 2, 8, [0, 0, 255, 255], 'above the apex');
    T.expectPixel(image, SIZE / 2, SIZE - 40, [255, 0, 0, 255], 'near the base');
    texture.destroy();
    return 'centre red, corners blue, upright';
  }, device);

  await T.test('msaa-resolve', async () => {
    const multisampled = device.createTexture({ size: [SIZE, SIZE], format: 'rgba8unorm', sampleCount: 4, usage: GPUTextureUsage.RENDER_ATTACHMENT });
    const resolved = device.createTexture({ size: [SIZE, SIZE], format: 'rgba8unorm', usage: TARGET });
    draw(colouredPipeline('rgba8unorm', 4), vertices(TRIANGLE, RED),
      { view: multisampled.createView(), resolveTarget: resolved.createView(), clearValue: BLUE, storeOp: 'discard' });
    const image = await T.readTexture(device, resolved);
    T.expectPixel(image, SIZE / 2, SIZE / 2, [255, 0, 0, 255], 'centre');
    T.expectPixel(image, 2, 2, [0, 0, 255, 255], 'corner');
    let blended = 0, other = 0;
    for (let i = 0; i < image.data.length; i += 4) {
      const r = image.data[i], gr = image.data[i + 1], b = image.data[i + 2], a = image.data[i + 3];
      if ((r === 255 && b === 0) || (r === 0 && b === 255)) continue;
      // A mix of red and blue: no green, opaque, red + blue adding up to about 255.
      if (gr <= 2 && a >= 253 && Math.abs(r + b - 255) <= 4) blended++;
      else other++;
    }
    multisampled.destroy();
    resolved.destroy();
    T.assert(!other, other + ' pixels are neither red, blue nor a mix of them');
    T.assert(blended, 'no blended pixels along the edges: the resolve did not average the samples');
    return 'centre red, corner blue, ' + blended + ' blended edge pixels';
  }, device);

  await T.test('depth', async () => {
    const texture = device.createTexture({ size: [SIZE, SIZE], format: 'rgba8unorm', usage: TARGET });
    const depth = device.createTexture({ size: [SIZE, SIZE], format: 'depth24plus', usage: GPUTextureUsage.RENDER_ATTACHMENT });
    // Near and green over the left half first, then far and red over everything.
    const data = quad(-1, 0, 0.2, GREEN).concat(quad(-1, 1, 0.8, RED));
    draw(colouredPipeline('rgba8unorm', 1, true), data, { view: texture.createView(), clearValue: BLUE }, depth.createView());
    const image = await T.readTexture(device, texture);
    T.expectPixel(image, SIZE / 4, SIZE / 2, [0, 255, 0, 255], 'left (near quad drawn first)');
    T.expectPixel(image, SIZE * 3 / 4, SIZE / 2, [255, 0, 0, 255], 'right (far quad)');
    texture.destroy();
    depth.destroy();
    return 'the near quad stays in front of the later far one';
  }, device);

  const texturedModule = device.createShaderModule({ code: TEXTURED });
  const texturedPipeline = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module: texturedModule, entryPoint: 'vs' },
    fragment: { module: texturedModule, entryPoint: 'fs', targets: [{ format: 'rgba8unorm' }] },
  });
  const nearest = device.createSampler({ magFilter: 'nearest', minFilter: 'nearest' });
  // Draws a texture view over the whole of a new SIZE x SIZE texture and reads that back.
  async function sampled(view) {
    const target = device.createTexture({ size: [SIZE, SIZE], format: 'rgba8unorm', usage: TARGET });
    const bindGroup = device.createBindGroup({
      layout: texturedPipeline.getBindGroupLayout(0),
      entries: [{ binding: 0, resource: nearest }, { binding: 1, resource: view }],
    });
    const encoder = device.createCommandEncoder();
    const pass = encoder.beginRenderPass({ colorAttachments: [{ view: target.createView(), clearValue: [0.5, 0.5, 0.5, 1], loadOp: 'clear', storeOp: 'store' }] });
    pass.setPipeline(texturedPipeline);
    pass.setBindGroup(0, bindGroup);
    pass.draw(6);
    pass.end();
    device.queue.submit([encoder.finish()]);
    const image = await T.readTexture(device, target);
    target.destroy();
    return image;
  }

  await T.test('write-texture-sample', async () => {
    const texture = device.createTexture({ size: [4, 4], format: 'rgba8unorm', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST });
    const texels = new Uint8Array(4 * 4 * 4);
    for (let y = 0; y < 4; y++)
      for (let x = 0; x < 4; x++)
        texels.set(y < 2 ? (x < 2 ? T.QUADRANTS.topLeft : T.QUADRANTS.topRight) : (x < 2 ? T.QUADRANTS.bottomLeft : T.QUADRANTS.bottomRight), (y * 4 + x) * 4);
    device.queue.writeTexture({ texture }, texels, { bytesPerRow: 16, rowsPerImage: 4 }, { width: 4, height: 4 });
    const image = await sampled(texture.createView());
    const wrong = T.quadrantsMismatch(image);
    texture.destroy();
    T.assert(!wrong, wrong);
    return 'four quadrants right, first texel row at the top';
  }, device);

  await T.test('write-buffer-copy', async () => {
    const pattern = new Uint8Array(256);
    for (let i = 0; i < 256; i++) pattern[i] = (i * 37 + 11) & 255;
    const source = device.createBuffer({ size: 256, usage: GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST });
    const target = device.createBuffer({ size: 256, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(source, 0, pattern);
    // Eight bytes of the pattern from index 100, written at offset 200.
    device.queue.writeBuffer(source, 200, pattern, 100, 8);
    const want = new Uint8Array(256);
    const written = pattern.slice();
    written.set(pattern.subarray(100, 108), 200);
    want.set(written.subarray(64, 192), 16);        // source 64..191 -> target 16..143
    want.set(written.subarray(200, 208), 160);      // source 200..207 -> target 160..167
    const encoder = device.createCommandEncoder();
    encoder.copyBufferToBuffer(source, 64, target, 16, 128);
    encoder.copyBufferToBuffer(source, 200, target, 160, 8);
    device.queue.submit([encoder.finish()]);
    await T.step(target.mapAsync(GPUMapMode.READ), 'mapAsync');
    const got = new Uint8Array(target.getMappedRange());
    let wrong = -1;
    for (let i = 0; i < 256 && wrong < 0; i++)
      if (got[i] !== want[i]) wrong = i;
    const detail = wrong < 0 ? '' : 'byte ' + wrong + ' is ' + got[wrong] + ', expected ' + want[wrong];
    target.unmap();
    source.destroy();
    target.destroy();
    T.assert(wrong < 0, detail);
    return '256 bytes right (two copies, untouched bytes zero)';
  }, device);

  await T.test('rgba16float', async () => {
    const texture = device.createTexture({ size: [SIZE, SIZE], format: 'rgba16float', usage: TARGET });
    draw(colouredPipeline('rgba16float', 1), vertices(TRIANGLE, [1.5, 0.25, -1, 1]), { view: texture.createView(), clearValue: [0.25, 0.5, 2, 1] });
    const image = await T.readTexture(device, texture);
    T.expectPixel(image, SIZE / 2, SIZE / 2, [1.5, 0.25, -1, 1], 'centre', 0.005);
    T.expectPixel(image, 2, 2, [0.25, 0.5, 2, 1], 'corner', 0.005);
    texture.destroy();
    return 'centre 1.5,0.25,-1,1 and corner 0.25,0.5,2,1 kept';
  }, device);

  await T.test('mip-levels', async () => {
    const texture = device.createTexture({
      size: [64, 64], format: 'rgba8unorm', mipLevelCount: 3,
      usage: TARGET | GPUTextureUsage.TEXTURE_BINDING,
    });
    T.assert(texture.mipLevelCount === 3, 'texture.mipLevelCount is ' + texture.mipLevelCount);
    const colours = [RED, GREEN, BLUE];
    const encoder = device.createCommandEncoder();
    for (let level = 0; level < 3; level++) {
      const view = texture.createView({ baseMipLevel: level, mipLevelCount: 1 });
      encoder.beginRenderPass({ colorAttachments: [{ view, clearValue: colours[level], loadOp: 'clear', storeOp: 'store' }] }).end();
    }
    device.queue.submit([encoder.finish()]);
    for (let level = 0; level < 3; level++) {
      const image = await T.readTexture(device, texture, level);
      const size = 64 >> level;
      T.assert(image.width === size && image.height === size, 'level ' + level + ' read as ' + image.width + 'x' + image.height);
      const want = colours[level].map(c => c * 255);
      T.expectPixel(image, 0, 0, want, 'level ' + level);
      T.expectPixel(image, size - 1, size - 1, want, 'level ' + level);
    }
    const image = await sampled(texture.createView({ baseMipLevel: 2, mipLevelCount: 1 }));
    T.expectPixel(image, SIZE / 2, SIZE / 2, [0, 0, 255, 255], 'a view of level 2 sampled');
    T.expectPixel(image, 3, 3, [0, 0, 255, 255], 'a view of level 2 sampled');
    texture.destroy();
    return 'levels 64, 32, 16 hold red, green, blue; a view of level 2 samples blue';
  }, device);
});
</script>
</body>
</html>
