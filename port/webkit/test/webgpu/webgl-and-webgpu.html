<!doctype html>
<!-- WebGL and WebGPU at the same time (release review G2). In the title,
     WebGL goes through ps5-opengl and WebGPU through RADV, on one GPU; each
     driver sets GPU state in one submission and relies on it in the next.
     The compositor takes the GPU submission lock around a frame's GL work
     (titleradv.c); WebGL does not. If a RADV submission falling between
     two of WebGL's breaks WebGL's state, it shows here.
     Two 320x180 canvases, the same picture drawn each frame: cleared to
     blue, 150 small opaque white quads in the middle band (WebGL: a flush
     every 10; WebGPU: one submit each), a red quad at half alpha blended
     over the left quarter, an opaque green quad over the right quarter.
     Every 4th frame both are read back (WebGL readPixels, WebGPU drawImage)
     at the left, right and top-middle: purple (blended), green, blue.
     Cases: setup; frames: N frames of both; webgl-pixels and
     webgpu-pixels: how many reads were wrong (any is a FAIL);
     uncaptured-errors. ?webgpu=0: WebGL alone (the control); ?frames=N
     (at most about 3500: each case has 60 s).
     Console, 2026-11-17: before the fix, WebGL lost its blending in 10 of
     451 reads (the red written unblended); WebGL alone 0 of 151. With
     WebGL's work under the GPU submission lock while a WebGPU device
     exists (RemoteGraphicsContextGLPS5.cpp): 0 of 451 and 0 of 899, 59.9
     fps.
     Upload the directory to /data/ps5webkit/webgpu/ and open
     file:///data/ps5webkit/webgpu/webgl-and-webgpu.html. -->
<html>
<head>
<meta charset="utf-8">
<title>WebGL and WebGPU</title>
<style>
  body { background: #111; color: #eee; font: 22px/1.35 sans-serif; margin: 40px; }
  canvas { width: 320px; height: 180px; border: 2px solid #555; margin-right: 12px; }
  #out { white-space: pre-wrap; overflow-wrap: anywhere; }
  .fail { color: #f66; } .skip { color: #fc6; } .info { color: #999; }
</style>
</head>
<body>
<h1>WebGL and WebGPU</h1>
<div><canvas id="gl" width="320" height="180"></canvas><canvas id="gpu" width="320" height="180"></canvas></div>
<div id="status">starting</div>
<div id="out"></div>
<script src="webgpu-test.js"></script>
<script>
const W = 320, H = 180, QUADS = 150, FLOATS = 6; // x, y, r, g, b, a per vertex
const params = new URLSearchParams(location.search);
const withWebGPU = params.get('webgpu') !== '0';
const FRAMES = Number(params.get('frames')) || 900;
const EXPECT = [
  { x: 20, y: 90, want: [128, 0, 128, 255], what: 'blended red over blue (left)' },
  { x: 300, y: 90, want: [0, 255, 0, 255], what: 'opaque green (right)' },
  { x: 160, y: 4, want: [0, 0, 255, 255], what: 'clear colour (top middle)' },
];

// The frame's vertices: QUADS white quads moving in the middle band, then the
// blended left quad, then the green right quad. Clip space, y up.
function vertices(frame) {
  const data = new Float32Array((QUADS + 2) * 6 * FLOATS);
  let o = 0;
  function quad(x0, y0, x1, y1, c) {
    for (const [x, y] of [[x0, y0], [x1, y0], [x0, y1], [x0, y1], [x1, y0], [x1, y1]]) {
      data.set([x, y, c[0], c[1], c[2], c[3]], o);
      o += FLOATS;
    }
  }
  for (let i = 0; i < QUADS; i++) {
    const t = frame * 0.03 + i * 0.7;
    const cx = Math.sin(t) * 0.35, cy = Math.cos(t * 1.3) * 0.6;
    quad(cx - 0.04, cy - 0.06, cx + 0.04, cy + 0.06, [1, 1, 1, 1]);
  }
  quad(-1, -1, -0.5, 1, [1, 0, 0, 0.5]);
  quad(0.5, -1, 1, 1, [0, 1, 0, 1]);
  return data;
}

function setUpWebGL(canvas) {
  const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: false });
  T.assert(gl, 'no webgl2 context');
  const vs = `#version 300 es
in vec2 p; in vec4 c; out vec4 v;
void main() { v = c; gl_Position = vec4(p, 0.0, 1.0); }`;
  const fs = `#version 300 es
precision mediump float; in vec4 v; out vec4 o;
void main() { o = v; }`;
  function shader(type, source) {
    const s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    T.assert(gl.getShaderParameter(s, gl.COMPILE_STATUS), gl.getShaderInfoLog(s));
    return s;
  }
  const program = gl.createProgram();
  gl.attachShader(program, shader(gl.VERTEX_SHADER, vs));
  gl.attachShader(program, shader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(program);
  T.assert(gl.getProgramParameter(program, gl.LINK_STATUS), gl.getProgramInfoLog(program));
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  const pLoc = gl.getAttribLocation(program, 'p'), cLoc = gl.getAttribLocation(program, 'c');
  gl.enableVertexAttribArray(pLoc);
  gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, FLOATS * 4, 0);
  gl.enableVertexAttribArray(cLoc);
  gl.vertexAttribPointer(cLoc, 4, gl.FLOAT, false, FLOATS * 4, 8);
  gl.useProgram(program);
  const pixel = new Uint8Array(4);
  return {
    draw(frame) {
      gl.viewport(0, 0, W, H);
      gl.bufferData(gl.ARRAY_BUFFER, vertices(frame), gl.DYNAMIC_DRAW);
      gl.disable(gl.BLEND);
      gl.clearColor(0, 0, 1, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      for (let i = 0; i < QUADS; i++) {
        gl.drawArrays(gl.TRIANGLES, i * 6, 6);
        if (i % 10 === 9) gl.flush(); // many small submissions
      }
      gl.enable(gl.BLEND);
      gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA); // as the WebGPU pipeline
      gl.drawArrays(gl.TRIANGLES, QUADS * 6, 6);
      gl.disable(gl.BLEND);
      gl.drawArrays(gl.TRIANGLES, (QUADS + 1) * 6, 6);
      gl.flush();
    },
    read(x, y) {
      gl.readPixels(x, H - 1 - y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
      return Array.from(pixel);
    },
  };
}

function setUpWebGPU(device, format, canvas) {
  const context = canvas.getContext('webgpu');
  T.assert(context, 'getContext("webgpu") returned ' + context);
  context.configure({ device, format, alphaMode: 'opaque' });
  const module = device.createShaderModule({ code: `
struct V { @builtin(position) p: vec4f, @location(0) c: vec4f }
@vertex fn vs(@location(0) p: vec2f, @location(1) c: vec4f) -> V { return V(vec4f(p, 0.0, 1.0), c); }
@fragment fn fs(v: V) -> @location(0) vec4f { return v.c; }` });
  const buffers = [{ arrayStride: FLOATS * 4, attributes: [
    { shaderLocation: 0, offset: 0, format: 'float32x2' }, { shaderLocation: 1, offset: 8, format: 'float32x4' }] }];
  const blend = { color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha' }, alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha' } };
  const pipeline = (blended) => device.createRenderPipeline({ layout: 'auto',
    vertex: { module, entryPoint: 'vs', buffers }, fragment: { module, entryPoint: 'fs', targets: [blended ? { format, blend } : { format }] } });
  const opaque = pipeline(false), blended = pipeline(true);
  const vb = device.createBuffer({ size: (QUADS + 2) * 6 * FLOATS * 4, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
  function submit(view, load, draws) {
    const encoder = device.createCommandEncoder();
    const pass = encoder.beginRenderPass({ colorAttachments: [{ view, clearValue: [0, 0, 1, 1], loadOp: load, storeOp: 'store' }] });
    pass.setVertexBuffer(0, vb);
    for (const [p, first] of draws) {
      pass.setPipeline(p);
      pass.draw(6, 1, first * 6);
    }
    pass.end();
    device.queue.submit([encoder.finish()]);
  }
  return {
    draw(frame) {
      device.queue.writeBuffer(vb, 0, vertices(frame));
      const view = context.getCurrentTexture().createView();
      submit(view, 'clear', []);
      for (let i = 0; i < QUADS; i++)
        submit(view, 'load', [[opaque, i]]); // one submission per quad
      submit(view, 'load', [[blended, QUADS], [opaque, QUADS + 1]]);
    },
    snapshot() {
      return T.snapshot(canvas, W, H);
    },
  };
}

T.run('webgl-and-webgpu', async () => {
  let gl = null, gpu = null;
  if (withWebGPU) {
    const g = await T.getDevice();
    if (!g) return;
    gpu = { device: g.device, format: g.format };
  }
  if (!await T.test('setup', async () => {
    gl = setUpWebGL(document.getElementById('gl'));
    if (gpu)
      gpu.scene = setUpWebGPU(gpu.device, gpu.format, document.getElementById('gpu'));
    return withWebGPU ? 'WebGL2 and WebGPU canvases' : 'WebGL2 alone (?webgpu=0, the control)';
  })) return;

  const wrong = { gl: [], gpu: [] }, reads = { gl: 0, gpu: 0 };
  const status = document.getElementById('status');
  function check(kind, readPixel, frame) {
    reads[kind]++;
    for (const e of EXPECT) {
      const got = readPixel(e.x, e.y);
      if (!T.near(got, e.want, 3)) {
        wrong[kind].push(frame);
        if (wrong[kind].length <= 5)
          T.info(kind + ' frame ' + frame + ': ' + e.what + ' at (' + e.x + ',' + e.y + ') is ' + T.show(got) + ', expected ' + T.show(e.want));
        return;
      }
    }
  }
  const animation = T.animate((now, frame) => {
    gl.draw(frame);
    if (gpu) gpu.scene.draw(frame);
    if (frame % 4 === 0) {
      check('gl', (x, y) => gl.read(x, y), frame);
      if (gpu) {
        const image = gpu.scene.snapshot();
        check('gpu', (x, y) => T.pixel(image, x, y), frame);
      }
    }
    if (frame % 60 === 0)
      status.textContent = 'frame ' + frame + ': WebGL ' + wrong.gl.length + ' wrong of ' + reads.gl + (gpu ? ', WebGPU ' + wrong.gpu.length + ' wrong of ' + reads.gpu : '');
  }, FRAMES, FRAMES * 100 + 20000);

  await T.test('frames', async () => {
    const m = await animation.measured;
    return FRAMES + ' frames, ' + m.fps.toFixed(1) + ' fps, ' + m.jsMs.toFixed(2) + ' ms of JavaScript per frame';
  });
  const detail = (kind) => wrong[kind].length + ' of ' + reads[kind] + ' reads wrong' + (wrong[kind].length ? ' (frames ' + wrong[kind].slice(0, 10).join(', ') + ')' : '');
  T.report('webgl-pixels', wrong.gl.length === 0, detail('gl'));
  if (gpu)
    T.report('webgpu-pixels', wrong.gpu.length === 0, detail('gpu'));
  T.report('uncaptured-errors', T.uncaptured.length === 0, T.uncaptured.length ? T.uncaptured.join(' | ') : 'none');
});
</script>
</body>
</html>
