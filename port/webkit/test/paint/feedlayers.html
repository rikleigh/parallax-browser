<!doctype html>
<html><head><meta charset="utf-8"><title>feed layers test</title>
<!-- Infinite feed for the composited-layer slowdown (COMPOSITING-PLAN.md,
     "Long feeds: composited layers and per-update cost"). Items stay in the
     DOM as the feed grows, like a video site's results and a forum's front
     page. Self-contained (no network): upload it to /data/ps5webkit/feedlayers.html
     and open file:///data/ps5webkit/feedlayers.html?n=500&t=ripple,ov
       ?n=<items>      items at load (default 30)
       &add=<items>    items appended when the end comes within two views
                       (default 20); &max=<items> stops there (default 5000)
       &t=<list>       per-item compositing triggers, comma separated:
         wc       the card has will-change: transform
         tz       the thumbnail has transform: translateZ(0)
         ov       the thumbnail is composited (will-change: transform) and a
                  positioned duration badge and progress bar sit over it
                  (later in paint order, overlapping a composited sibling)
         sticky   a sticky date heading every 10 items
         preview  an empty hover-preview box (position absolute, opacity 0,
                  will-change: opacity) over each thumbnail, like a video
                  site's inline player placeholder
         ripple   touch-feedback shapes: two positioned fill/stroke divs in
                  each of the 3 buttons per item (opacity 0, opacity transition)
         ripplewc the same with will-change: opacity
         contain  the card has contain: layout paint
         fade     cards fade in (opacity 0 -> 1 over 400 ms) when appended
         menu     a positioned "more" menu button (z-index 1) in each card
         io       an IntersectionObserver on every card (lazy loading)
         wheel    a passive wheel listener on the window (the title sends
                  DOM wheel events while it scrolls)
         attr     while the page scrolls, every animation frame flips an
                  attribute on the feed's container (off 200 ms after the
                  last scroll), which rules like "#feed[data-scrolling]
                  .fill" depend on: each change walks the whole feed for
                  style invalidation, as a video site's script does
       &load=<ms>      append only when the end is within one view, after a
                       "network" wait of that long, with a loading spinner at
                       the end of the feed meanwhile (an infinite feed)
       &spinner=nested|single|css  the spinner: nested rotating elements like
                       a material spinner (default), one rotating element, or
                       a non-composited border-color animation
       &hdr=0          no sticky page header / fixed bottom bar (default both)
       &hover          a timer moves a "hover" class over the visible cards
                       (a preview box shows) every 500 ms, as a pointer would
     Logs (console.log): FEED <t> s: items n, scrollY y, height h, appended n
     once a second while anything changes. -->
<style>
html { background: #0f0f0f; }
body { margin: 0; font: 18px/1.4 sans-serif; color: #f1f1f1; background: #0f0f0f; }
#hdr { position: sticky; top: 0; z-index: 10; height: 56px; background: #212121; font: bold 24px/56px sans-serif; padding: 0 24px; border-bottom: 2px solid #c00; }
#bar { position: fixed; bottom: 0; left: 0; right: 0; height: 40px; z-index: 10; background: #181818; border-top: 2px solid #333; font: 16px/40px sans-serif; padding: 0 24px; }
main { width: 1240px; margin: 0 auto; padding: 8px 0 80px; }
h3 { position: sticky; top: 58px; z-index: 5; margin: 8px 0; padding: 6px 12px; background: #263238; font-size: 18px; }
body.nohdr h3 { top: 0; }
.card { display: flex; gap: 16px; margin: 0 0 16px; padding: 8px; border-radius: 12px; background: #181818; position: relative; }
.thumbbox { position: relative; flex: 0 0 360px; height: 202px; border-radius: 10px; overflow: hidden; }
.thumb { position: absolute; inset: 0; border-radius: 10px; }
.badge { position: absolute; right: 6px; bottom: 6px; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,.8); font-size: 14px; }
.prog { position: absolute; left: 0; bottom: 0; height: 4px; background: #f00; }
.preview { position: absolute; inset: 0; opacity: 0; background: #000; transition: opacity .2s; }
.card.hover .preview { opacity: .6; }
.meta { flex: 1; min-width: 0; }
.meta h4 { margin: 4px 0 6px; font-size: 20px; }
.meta p { margin: 2px 0; color: #aaa; font-size: 15px; }
.btns { display: flex; gap: 8px; margin-top: 10px; }
.btn { position: relative; padding: 6px 14px; border-radius: 18px; background: #272727; font-size: 14px; }
.fill, .stroke { position: absolute; inset: 0; border-radius: inherit; opacity: 0; transition: opacity .3s; }
.fill { background: rgba(255,255,255,.1); }
.stroke { border: 1px solid rgba(255,255,255,.3); }
.menu { position: absolute; top: 8px; right: 8px; z-index: 1; width: 32px; height: 32px; border-radius: 16px; background: #272727; text-align: center; line-height: 32px; }
body.t-wc .card { will-change: transform; }
body.t-tz .thumb { transform: translateZ(0); }
body.t-ov .thumb { will-change: transform; }
body.t-preview .preview { will-change: opacity; }
body.t-ripplewc .fill, body.t-ripplewc .stroke { will-change: opacity; }
body.t-contain .card { contain: layout paint; }
.card.fading { opacity: 0; }
#spin { display: none; position: relative; width: 48px; height: 48px; margin: 24px auto; }
#spin.on { display: block; }
#spin .sc { width: 100%; height: 100%; animation: sp-rot 1568ms linear infinite; }
#spin .layer { position: absolute; inset: 0; animation: sp-fill 5332ms cubic-bezier(.4,0,.2,1) infinite both; }
#spin .clip { position: absolute; top: 0; width: 50%; height: 100%; overflow: hidden; }
#spin .clip.l { left: 0; } #spin .clip.r { right: 0; }
#spin .circle { position: absolute; top: 0; width: 200%; height: 100%; box-sizing: border-box; border: 4px solid #3ea6ff; border-bottom-color: transparent; border-radius: 50%; animation: sp-l 1333ms cubic-bezier(.4,0,.2,1) infinite both; }
#spin .clip.l .circle { left: 0; border-right-color: transparent; }
#spin .clip.r .circle { left: -100%; border-left-color: transparent; animation-name: sp-r; }
#spin.single .sc { border: 4px solid #3ea6ff; border-bottom-color: transparent; border-radius: 50%; box-sizing: border-box; }
#spin.css .sc { animation: sp-color 800ms linear infinite; border: 4px solid #3ea6ff; border-radius: 50%; box-sizing: border-box; }
@keyframes sp-rot { to { transform: rotate(360deg); } }
@keyframes sp-fill { 12.5% { transform: rotate(135deg); } 25% { transform: rotate(270deg); } 37.5% { transform: rotate(405deg); } 50% { transform: rotate(540deg); } 62.5% { transform: rotate(675deg); } 75% { transform: rotate(810deg); } 87.5% { transform: rotate(945deg); } to { transform: rotate(1080deg); } }
@keyframes sp-l { from { transform: rotate(130deg); } 50% { transform: rotate(-5deg); } to { transform: rotate(130deg); } }
@keyframes sp-r { from { transform: rotate(-130deg); } 50% { transform: rotate(5deg); } to { transform: rotate(-130deg); } }
@keyframes sp-color { 50% { border-color: #ff4e45; } }
.card.fadein { opacity: 1; transition: opacity .4s; }
#feed[data-scrolling] .fill { background: rgba(255,255,255,.05); }
#feed[data-scrolling] .meta p { color: #bbb; }
</style></head>
<body>
<div id="hdr">feed layers</div>
<main id="feed"></main>
<div id="spin"><div class="sc"></div></div>
<div id="bar">items <span id="count">0</span></div>
<script>
const q = new URLSearchParams(location.search);
const n0 = +(q.get('n') || 30), add = +(q.get('add') || 20), max = +(q.get('max') || 5000);
const t = new Set((q.get('t') || '').split(',').filter(Boolean));
const hdr = q.get('hdr') !== '0';
const loadMS = q.has('load') ? +q.get('load') : -1;
const spinKind = q.get('spinner') || 'nested';
const spin = document.getElementById('spin');
if (spinKind === 'nested')
  spin.firstElementChild.innerHTML = '<div class="layer"><div class="clip l"><div class="circle"></div></div><div class="clip r"><div class="circle"></div></div></div>';
else
  spin.classList.add(spinKind);
let loading = false, loads = 0;
const io = t.has('io') ? new IntersectionObserver((entries) => {
  for (const e of entries) e.target.classList.toggle('seen', e.isIntersecting);
}, { rootMargin: '200px' }) : null;
if (t.has('wheel'))
  addEventListener('wheel', () => { window.wheelCount = (window.wheelCount || 0) + 1; }, { passive: true });
for (const k of t) document.body.classList.add('t-' + k);
if (!hdr) {
  document.body.classList.add('nohdr');
  document.getElementById('hdr').remove();
  document.getElementById('bar').remove();
}
const feed = document.getElementById('feed');
const countEl = document.getElementById('count');
let items = 0, appended = 0, lastLog = '';

function hue(i) { return (i * 47) % 360; }
function makeItem(i) {
  const card = document.createElement('div');
  card.className = 'card';
  const ripple = t.has('ripple') || t.has('ripplewc');
  const btn = (label) => '<div class="btn">' + label + (ripple ? '<div class="fill"></div><div class="stroke"></div>' : '') + '</div>';
  const ov = t.has('ov');
  card.innerHTML =
    '<div class="thumbbox"><div class="thumb" style="background:linear-gradient(135deg,hsl(' + hue(i) + ',60%,45%),hsl(' + hue(i + 3) + ',60%,25%))"></div>' +
    (ov ? '<div class="badge">' + (i % 60) + ':' + String(i % 59).padStart(2, '0') + '</div><div class="prog" style="width:' + (i * 13 % 100) + '%"></div>' : '') +
    (t.has('preview') ? '<div class="preview"></div>' : '') + '</div>' +
    '<div class="meta"><h4>Item ' + i + ': a synthetic title that is long enough to wrap onto a second line in this column</h4>' +
    '<p>Channel ' + (i % 37) + ' &middot; ' + (i * 7919 % 1000) + 'K views &middot; ' + (i % 12 + 1) + ' days ago</p>' +
    '<p>Description text for item ' + i + ', a couple of lines of ordinary inline content that paints into the card.</p>' +
    '<div class="btns">' + btn('Like') + btn('Share') + btn('Save') + '</div></div>' +
    (t.has('menu') ? '<div class="menu">&#8942;</div>' : '');
  return card;
}
function append(count) {
  const frag = document.createDocumentFragment();
  const fresh = [];
  for (let k = 0; k < count && items < max; k++, items++) {
    if (t.has('sticky') && items % 10 === 0) {
      const h = document.createElement('h3');
      h.textContent = 'Section ' + (items / 10);
      frag.appendChild(h);
    }
    const card = makeItem(items);
    if (t.has('fade') && appended) { card.classList.add('fading'); fresh.push(card); }
    frag.appendChild(card);
    if (io) io.observe(card);
  }
  feed.appendChild(frag);
  appended++;
  countEl.textContent = items;
  if (fresh.length)
    requestAnimationFrame(() => requestAnimationFrame(() => {
      for (const c of fresh) { c.classList.remove('fading'); c.classList.add('fadein'); }
    }));
}
append(n0);
function check() {
  if (items >= max || loading)
    return;
  const left = document.documentElement.scrollHeight - (scrollY + innerHeight);
  if (loadMS < 0) {
    if (left < 2 * innerHeight)
      append(add);
    return;
  }
  // An infinite feed: the spinner shows at the end while the next batch
  // "loads", then the items replace it.
  if (left < innerHeight) {
    loading = true;
    spin.classList.add('on');
    setTimeout(() => { append(add); loads++; spin.classList.remove('on'); loading = false; }, loadMS);
  }
}
addEventListener('scroll', check, { passive: true });
if (t.has('attr')) {
  let lastScroll = 0, frame = 0;
  const tick = () => {
    frame = 0;
    // Flipped in every frame while scrolling (one walk per frame), off after.
    const on = performance.now() - lastScroll < 200;
    feed.toggleAttribute('data-scrolling', on && !feed.hasAttribute('data-scrolling'));
    if (on) frame = requestAnimationFrame(tick);
    else setTimeout(() => { if (!frame && performance.now() - lastScroll < 200) frame = requestAnimationFrame(tick); }, 0);
  };
  addEventListener('scroll', () => { lastScroll = performance.now(); if (!frame) frame = requestAnimationFrame(tick); }, { passive: true });
}
setInterval(check, 250);
if (q.has('hover')) {
  let prev = null;
  setInterval(() => {
    const el = document.elementFromPoint(innerWidth / 2 - 300, innerHeight / 2);
    const card = el && el.closest('.card');
    if (prev && prev !== card) prev.classList.remove('hover');
    if (card) card.classList.add('hover');
    prev = card;
  }, 500);
}
const t0 = performance.now();
setInterval(() => {
  const line = 'items ' + items + ', scrollY ' + Math.round(scrollY) + ', height ' + document.documentElement.scrollHeight + ', appended ' + appended + (loadMS >= 0 ? ', loads ' + loads + (loading ? ' (loading)' : '') : '') + (t.has('wheel') ? ', wheel ' + (window.wheelCount || 0) : '');
  if (line !== lastLog) {
    console.log('FEED ' + ((performance.now() - t0) / 1000).toFixed(1) + ' s: ' + line);
    lastLog = line;
  }
}, 1000);
console.log('FEED start: n ' + n0 + ', add ' + add + ', triggers ' + ([...t].join(',') || 'none') + (hdr ? '' : ', no header') + (loadMS >= 0 ? ', load ' + loadMS + ' ms, spinner ' + spinKind : ''));
</script>
</body></html>
