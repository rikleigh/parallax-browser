<!doctype html>
<html><head><meta charset="utf-8"><title>carousel cards test</title>
<!-- Cards in horizontal scrollers whose paint-order parent is outside the
     scroller (COMPOSITING-PLAN.md, "Carousel snap feel and the missing last
     card"), as product pages build their media galleries: the scroller is
     position: relative without z-index (not a stacking context), each card is
     position: relative + isolation: isolate + overflow: clip (a stacking
     context of its own), so WebKit composites it ("overflow scroll
     positioning") and moves it with the scroller. Synthetic content only.
       ?step=<ms>   scroll every carousel one card further from script
                    (instant), then back, every <ms> (default 1500; 0 = off)
     Carousels (top to bottom):
       iso      cards as above, always displayed
       toggle   cards as above; cards more than one away from the current one
                are display: none, switched from scroll events after 200 ms
                (as such galleries do), so cards appear while off screen
       litf     each item (li) has transform: translateY(0) (a stacking context
                whose paint-order parent is outside the scroller: WebKit lets it
                paint into the scroller's scrolled contents, "backing sharing"),
                cards as "iso" with an absolutely positioned picture inside
       litf-toggle  as "litf", with the "toggle" display switching
       vis      each item is composited (will-change: opacity) and items more
                than one away from the current one are visibility: hidden,
                switched as "toggle" (as staggered fade-in galleries do): a
                composited layer whose contents are hidden while it scrolls
                into view and then shown (WC before 2026-11-02: it stayed blank)
       plain    control: cards without a stacking context
     Each card: a distinct gradient and its number. Logs:
       CC <t> s <name>: left <scrollLeft>/<max>, current <i>, shown <list> -->
<style>
html, body { margin: 0; background: #1d1d1f; color: #fff; font: 20px sans-serif; }
.wrap { position: relative; margin: 14px 0; }
.label { position: absolute; left: 20px; top: -2px; font-size: 16px; color: #aaa; }
.scroller { position: relative; overflow-x: scroll; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; padding-top: 22px; }
.scroller::-webkit-scrollbar { display: none; }
ul { display: grid; grid-auto-flow: column; gap: 20px; margin: 0; padding: 0 650px; list-style: none; width: fit-content; }
li { display: flex; width: 620px; height: 140px; scroll-snap-align: center; }
.litf li { transform: translateY(0); }
.vis li { will-change: opacity; }
.vis li.out { visibility: hidden; }
.pic { position: absolute; inset: 20px 200px; border-radius: 12px; }
.card { width: 100%; border-radius: 24px; display: grid; place-items: center; font-size: 90px; font-weight: bold; }
.iso .card, .toggle .card, .litf .card { position: relative; isolation: isolate; overflow: clip; }
.toggle li.out .card, .litf.toggle li.out .card { display: none; }
</style></head><body>
<div class="wrap"><div class="label">iso</div><div class="scroller iso" data-name="iso"><ul></ul></div></div>
<div class="wrap"><div class="label">toggle</div><div class="scroller toggle" data-name="toggle"><ul></ul></div></div>
<div class="wrap"><div class="label">litf</div><div class="scroller litf" data-name="litf"><ul></ul></div></div>
<div class="wrap"><div class="label">litf-toggle</div><div class="scroller litf toggle" data-name="litf-toggle"><ul></ul></div></div>
<div class="wrap"><div class="label">vis</div><div class="scroller vis" data-name="vis"><ul></ul></div></div>
<div class="wrap"><div class="label">plain</div><div class="scroller plain" data-name="plain"><ul></ul></div></div>
<script>
(function () {
    var params = new URLSearchParams(location.search);
    var step = params.has("step") ? parseInt(params.get("step"), 10) : 1500;
    var t0 = performance.now();
    function T() { return ((performance.now() - t0) / 1000).toFixed(1); }
    var N = 8;
    var scrollers = Array.prototype.slice.call(document.querySelectorAll(".scroller"));
    scrollers.forEach(function (sc) {
        var ul = sc.querySelector("ul");
        for (var i = 0; i < N; i++) {
            var li = document.createElement("li");
            var card = document.createElement("div");
            card.className = "card";
            var h = (i * 47) % 360;
            card.style.background = "linear-gradient(135deg, hsl(" + h + ",70%,45%), hsl(" + ((h + 60) % 360) + ",70%,25%))";
            card.textContent = String(i + 1);
            if (sc.classList.contains("litf")) {
                var pic = document.createElement("div");
                pic.className = "pic";
                pic.style.background = "repeating-linear-gradient(45deg, #fff 0 10px, hsl(" + ((h + 180) % 360) + ",80%,50%) 10px 20px)";
                card.appendChild(pic);
            }
            li.appendChild(card);
            ul.appendChild(li);
        }
    });
    function current(sc) {
        var items = sc.querySelectorAll("li"), mid = sc.scrollLeft + sc.clientWidth / 2, best = 0, bd = 1e9;
        for (var i = 0; i < items.length; i++) {
            var c = items[i].offsetLeft + items[i].offsetWidth / 2, d = Math.abs(c - mid);
            if (d < bd) { bd = d; best = i; }
        }
        return best;
    }
    function updateToggle(sc) {
        var cur = current(sc), items = sc.querySelectorAll("li");
        for (var i = 0; i < items.length; i++)
            items[i].classList.toggle("out", Math.abs(cur - i) > 1);
    }
    function log(sc) {
        var items = sc.querySelectorAll("li"), shown = [];
        for (var i = 0; i < items.length; i++)
            if (getComputedStyle(items[i].firstChild).display !== "none" && getComputedStyle(items[i]).visibility !== "hidden") shown.push(i + 1);
        console.log("CC " + T() + " s " + sc.dataset.name + ": left " + sc.scrollLeft.toFixed(0) + "/" + (sc.scrollWidth - sc.clientWidth) + ", current " + (current(sc) + 1) + ", shown " + shown.join(","));
    }
    scrollers.forEach(function (sc) {
        var toggles = sc.classList.contains("toggle") || sc.classList.contains("vis");
        if (toggles) updateToggle(sc);
        var timer = 0;
        sc.addEventListener("scroll", function () {
            clearTimeout(timer);
            timer = setTimeout(function () {
                if (toggles) updateToggle(sc);
                setTimeout(function () { log(sc); }, 50);
            }, 200);
        }, { passive: true });
    });
    if (step > 0) {
        var k = 0, dir = 1;
        setInterval(function () {
            k += dir;
            if (k >= N - 1 || k <= 0) dir = -dir;
            scrollers.forEach(function (sc) {
                var li = sc.querySelectorAll("li")[k];
                sc.scrollTo({ left: li.offsetLeft + li.offsetWidth / 2 - sc.clientWidth / 2, behavior: "instant" });
            });
        }, step);
    }
})();
</script>
</body></html>
