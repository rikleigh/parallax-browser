<!doctype html>
<!-- Web Audio (AudioContext) on PS5: the API games use for all their sound
     (Unity's start-up calls alert() without it, which game portals show as a
     "the game crashed" screen). Checks, in order: AudioContext exists and
     starts running; its clock (currentTime) advances in step with real time,
     i.e. the output (ps5audiosink, to the title) is consuming samples;
     decodeAudioData of a WAV made here (GStreamer decode + deinterleave);
     an OfflineAudioContext render (sum of a known buffer); and a 1 s 440 Hz
     tone, quiet, for the ear. Then Ogg and Opus: canPlayType and
     isTypeSupported answers; decodeAudioData of Ogg Vorbis, Ogg Opus and
     WebM Opus clips (oggdemux + vorbisdec/opusdec, matroskademux); <audio>
     playing each Ogg clip to its end; Opus in WebM through MSE (opusparse;
     http pages only: MSE from a file:// page fails, so it is SKIP there).
     Then an AudioWorklet (secure contexts only: file:// yes, plain http
     SKIP; its module from a blob: URL, on file:// a data: URL), offline (a processor writing a constant) and live (its frame
     count over 1 s), and a MediaElementAudioSourceNode (an <audio> playing the
     WebM clip, its samples seen by an AnalyserNode). Log lines: RESULT
     webaudio <check> PASS|FAIL|SKIP ..., then RESULT webaudio summary.
     Upload to /data/ps5webkit/webaudio.html and open
     file:///data/ps5webkit/webaudio.html; for MSE, serve it with
     tools/serve-media.py --port 8773 --page port/webkit/test/audio/webaudio.html
     and open http://<mac>:8773/webaudio.html. ?click waits for a click first
     (for desktop browsers, which start audio only after one);
     ?only=media-element|worklet|ogg runs just that part.
     The clips (CLIPS below, base64) are 1 kHz tones at half scale (peaks
     0.5-0.6 after encoding), made with ffmpeg:
       T="0.5*sin(2*PI*1000*t)"
       ffmpeg -f lavfi -i "aevalsrc=$T:s=48000:d=0.5" -c:a libvorbis -q:a 0 tone-vorbis.ogg
       ffmpeg -f lavfi -i "aevalsrc=$T:s=48000:d=0.5" -c:a libopus -b:a 24k tone-opus.ogg
       ffmpeg -f lavfi -i "aevalsrc=$T|$T:s=48000:d=2" -c:a libopus -b:a 32k tone-opus.webm -->

    'z4hCphI8gxBOdCSIznEt21SsMTCeKmubdSI3SN7y3GPDuLh4uorp6vTFqOR5xwUq35P7U1sOu/MN0v0UlnHoCW++vOiQi1ZSNTLW' +

    'PhmUKT/y95IV6xJ34A/z///o6u/8z3f/ud/+IxGgQKehQJ2BB9EA/J/G9CrUYYeEojRJRYQQH9U8b4HFQTCy9aMhlcT7cBLHnc1G' +

<script>
const out = document.getElementById('out');
function say(line) {
  console.log(line);
  out.textContent += line + '\n';
}
let failures = 0, skipped = 0;
function result(name, ok, detail) {
  if (!ok) failures++;
  say('RESULT webaudio ' + name + ' ' + (ok ? 'PASS' : 'FAIL') + (detail ? ' ' + detail : ''));
}
function skip(name, why) {
  skipped++;
  say('RESULT webaudio ' + name + ' SKIP ' + why);
}
function clip(name) {
  const bin = atob(CLIPS[name]), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
function peakOf(data) {
  let peak = 0;
  for (let i = 0; i < data.length; i++) peak = Math.max(peak, Math.abs(data[i]));
  return peak;
}
function within(promise, ms, what) {
  return Promise.race([promise, sleep(ms).then(() => { throw new Error('timed out after ' + ms + ' ms ' + what); })]);
}
function mediaError(el) {
  return el.error ? 'MediaError ' + el.error.code + (el.error.message ? ' ' + el.error.message : '') : 'no error';
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ONLY = new URLSearchParams(location.search).get('only');

// A mono 16-bit WAV: 0.5 s of a 1 kHz sine at 44.1 kHz.
function makeWav() {
  const rate = 44100, n = rate / 2;
  const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++)
    v.setInt16(44 + i * 2, Math.round(Math.sin(2 * Math.PI * 1000 * i / rate) * 16000), true);
  return buf;
}

async function run() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  result('api', !!Ctx, Ctx ? '' : '(no AudioContext)');
  if (!Ctx) return;

  const ctx = new Ctx();
  try { await ctx.resume(); } catch (e) { say('resume: ' + e); }
  await sleep(300);
  if (ONLY) {
    const checks = { 'media-element': mediaElementSource, 'worklet': worklet, 'ogg': oggAndOpus };
    if (!checks[ONLY]) throw new Error('unknown ?only=' + ONLY);
    await checks[ONLY](ctx);
    say('RESULT webaudio summary ' + (failures ? 'FAIL' : 'PASS') + ' (' + failures + ' failed, ' + skipped + ' skipped; only ' + ONLY + ')');
    return;
  }
  result('running', ctx.state === 'running', 'state ' + ctx.state + ', sample rate ' + ctx.sampleRate);

  // The clock moves only while the output pulls samples.
  const t0 = ctx.currentTime, w0 = performance.now();
  await sleep(2000);
  const advanced = ctx.currentTime - t0, wall = (performance.now() - w0) / 1000;
  result('clock', advanced > wall * 0.8 && advanced < wall * 1.2,
         'currentTime +' + advanced.toFixed(3) + ' s in ' + wall.toFixed(3) + ' s');

  try {
    const decoded = await ctx.decodeAudioData(makeWav());
    const data = decoded.getChannelData(0);
    let peak = 0;
    for (let i = 0; i < data.length; i++) peak = Math.max(peak, Math.abs(data[i]));
    result('decode', Math.abs(decoded.duration - 0.5) < 0.02 && peak > 0.4 && peak < 0.55,
           decoded.duration.toFixed(3) + ' s, ' + decoded.numberOfChannels + ' ch, ' + decoded.sampleRate + ' Hz, peak ' + peak.toFixed(3));
  } catch (e) {
    result('decode', false, String(e));
  }

  try {
    const offline = new OfflineAudioContext(1, 4410, 44100);
    const b = offline.createBuffer(1, 4410, 44100);
    b.getChannelData(0).fill(0.25);
    const src = offline.createBufferSource();
    src.buffer = b;
    const gain = offline.createGain();
    gain.gain.value = 2;
    src.connect(gain).connect(offline.destination);
    src.start();
    const rendered = await offline.startRendering();
    const d = rendered.getChannelData(0);
    let sum = 0;
    for (let i = 0; i < d.length; i++) sum += d[i];
    result('offline', Math.abs(sum / d.length - 0.5) < 0.001, 'mean ' + (sum / d.length).toFixed(4));
  } catch (e) {
    result('offline', false, String(e));
  }

  // 1 s of a quiet 440 Hz tone (listen for it).
  const osc = ctx.createOscillator(), g = ctx.createGain();
  g.gain.value = 0.1;
  osc.frequency.value = 440;
  osc.connect(g).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 1);
  await new Promise(r => osc.onended = r);
  result('tone', true, '(1 s at 440 Hz played; listen)');

  await oggAndOpus(ctx);
  await worklet(ctx);
  await mediaElementSource(ctx);

  say('RESULT webaudio summary ' + (failures ? 'FAIL' : 'PASS') + ' (' + failures + ' failed, ' + skipped + ' skipped)');
}

const TYPES = [
  ['audio/ogg; codecs="vorbis"', 'audio/ogg; codecs="opus"', 'audio/webm; codecs="opus"', 'audio/ogg'],
  ['audio/webm; codecs="opus"', 'audio/webm; codecs="vorbis"'],
];

async function oggAndOpus(ctx) {
  const probe = document.createElement('audio');
  const answers = TYPES[0].map(t => t + ': ' + (probe.canPlayType(t) || '""'));
  result('canplaytype', TYPES[0].slice(0, 3).every(t => probe.canPlayType(t) === 'probably') && probe.canPlayType('audio/ogg') !== '',
         answers.join(', '));
  if (window.MediaSource) {
    result('mse-types', MediaSource.isTypeSupported(TYPES[1][0]),
           TYPES[1].map(t => t + ': ' + MediaSource.isTypeSupported(t)).join(', '));
  } else {
    result('mse-types', false, '(no MediaSource)');
  }

  // decodeAudioData: every clip is a 1 kHz tone at half scale.
  for (const [name, duration] of [['tone-vorbis.ogg', 0.5], ['tone-opus.ogg', 0.5], ['tone-opus.webm', 2]]) {
    try {
      const decoded = await within(ctx.decodeAudioData(clip(name).buffer), 5000, 'decoding');
      const peak = peakOf(decoded.getChannelData(0));
      result('decode ' + name, Math.abs(decoded.duration - duration) < 0.03 && peak > 0.4 && peak < 0.7,
             decoded.duration.toFixed(3) + ' s, ' + decoded.numberOfChannels + ' ch, ' + decoded.sampleRate + ' Hz, peak ' + peak.toFixed(3));
    } catch (e) {
      result('decode ' + name, false, String(e));
    }
  }

  // <audio>: each Ogg clip plays to its end, quietly.
  for (const [name, type] of [['tone-vorbis.ogg', 'audio/ogg'], ['tone-opus.ogg', 'audio/ogg']]) {
    const el = new Audio();
    el.volume = 0.2;
    el.src = URL.createObjectURL(new Blob([clip(name)], { type }));
    try {
      const ended = new Promise((resolve, reject) => { el.onended = resolve; el.onerror = () => reject(new Error(mediaError(el))); });
      await el.play();
      await within(ended, 5000, 'waiting for the end');
      result('element ' + name, Math.abs(el.duration - 0.5) < 0.05, 'ended at ' + el.currentTime.toFixed(3) + ' s of ' + el.duration.toFixed(3) + ' s');
    } catch (e) {
      result('element ' + name, false, String(e) + ' (readyState ' + el.readyState + ', ' + mediaError(el) + ')');
    }
    URL.revokeObjectURL(el.src);
    el.removeAttribute('src');
    el.load();
  }

  // MSE: the WebM Opus clip appended in one go, played quietly past 1 s.
  if (location.protocol === 'file:') {
    skip('mse-opus', '(MSE needs an http page: see the header)');
  } else if (!window.MediaSource) {
    result('mse-opus', false, '(no MediaSource)');
  } else {
    const el = new Audio(), ms = new MediaSource();
    el.volume = 0.2;
    el.src = URL.createObjectURL(ms);
    try {
      await within(new Promise(r => ms.addEventListener('sourceopen', r, { once: true })), 5000, 'for sourceopen');
      const sb = ms.addSourceBuffer(TYPES[1][0]);
      sb.appendBuffer(clip('tone-opus.webm'));
      await within(new Promise((resolve, reject) => { sb.onupdateend = resolve; sb.onerror = () => reject(new Error('append error')); }), 5000, 'appending');
      ms.endOfStream();
      const buffered = sb.buffered.length ? sb.buffered.end(0).toFixed(3) : 'nothing';
      await el.play();
      const t0 = performance.now();
      while (el.currentTime < 1 && !el.ended && !el.error && performance.now() - t0 < 5000)
        await sleep(100);
      result('mse-opus', el.currentTime >= 1 || el.ended, 'buffered to ' + buffered + ' s, played to ' + el.currentTime.toFixed(3) + ' s, ' + mediaError(el));
    } catch (e) {
      result('mse-opus', false, String(e) + ' (' + mediaError(el) + ')');
    }
    el.pause();
  }
}

// A processor that writes a constant, and counts the frames it rendered.
const PROCESSOR = `
class Constant extends AudioWorkletProcessor {
  constructor() {
    super();
    this.frames = 0;
    this.port.onmessage = () => this.port.postMessage(this.frames);
  }
  process(inputs, outputs) {
    for (const channel of outputs[0])
      channel.fill(0.25);
    this.frames += outputs[0][0].length;
    return true;
  }
}
registerProcessor('constant', Constant);
`;

async function worklet(ctx) {
  if (!window.isSecureContext || !ctx.audioWorklet) {
    skip('worklet', '(secure context ' + window.isSecureContext + ', audioWorklet ' + !!ctx.audioWorklet + ')');
    return;
  }
  // A file:// page's origin is opaque: WebKit refuses its blob: module
  // (worklets load in CORS mode), so it gets a data: URL instead.
  const url = location.protocol === 'file:' ? 'data:application/javascript;base64,' + btoa(PROCESSOR)
                                            : URL.createObjectURL(new Blob([PROCESSOR], { type: 'application/javascript' }));
  try {
    const offline = new OfflineAudioContext(1, 4800, 48000);
    await within(offline.audioWorklet.addModule(url), 5000, 'loading the module');
    new AudioWorkletNode(offline, 'constant').connect(offline.destination);
    const d = (await offline.startRendering()).getChannelData(0);
    let sum = 0;
    for (let i = 0; i < d.length; i++) sum += d[i];
    result('worklet offline', Math.abs(sum / d.length - 0.25) < 0.001, 'mean ' + (sum / d.length).toFixed(4));
  } catch (e) {
    result('worklet offline', false, String(e));
  }
  try {
    await within(ctx.audioWorklet.addModule(url), 5000, 'loading the module');
    const node = new AudioWorkletNode(ctx, 'constant'), silent = ctx.createGain();
    silent.gain.value = 0;
    node.connect(silent).connect(ctx.destination);
    const frames = () => new Promise(r => { node.port.onmessage = e => r(e.data); node.port.postMessage(0); });
    const f0 = await within(frames(), 2000, 'for the processor'), w0 = performance.now();
    await sleep(1000);
    const f1 = await within(frames(), 2000, 'for the processor'), wall = (performance.now() - w0) / 1000;
    const rate = (f1 - f0) / wall;
    node.disconnect();
    result('worklet live', rate > ctx.sampleRate * 0.8 && rate < ctx.sampleRate * 1.2,
           (f1 - f0) + ' frames in ' + wall.toFixed(3) + ' s (' + Math.round(rate) + ' per s at ' + ctx.sampleRate + ' Hz)');
  } catch (e) {
    result('worklet live', false, String(e));
  }
  if (url.startsWith('blob:'))
    URL.revokeObjectURL(url);
}

// An <audio>'s samples routed into the graph: the analyser sees the tone.
async function mediaElementSource(ctx) {
  // The 2 s clip: long enough without looping (a looped 0.5 s clip clicks
  // at every loop).
  const el = new Audio();
  el.src = URL.createObjectURL(new Blob([clip('tone-opus.webm')], { type: 'audio/webm' }));
  try {
    const source = ctx.createMediaElementSource(el), analyser = ctx.createAnalyser(), quiet = ctx.createGain();
    analyser.fftSize = 2048;
    quiet.gain.value = 0.1;
    source.connect(analyser).connect(quiet).connect(ctx.destination);
    await el.play();
    const buf = new Float32Array(analyser.fftSize);
    let peak = 0;
    const t0 = performance.now();
    while (performance.now() - t0 < 1500) {
      await sleep(50);
      analyser.getFloatTimeDomainData(buf);
      peak = Math.max(peak, peakOf(buf));
    }
    result('media-element-source', peak > 0.4 && peak < 0.7,
           'peak ' + peak.toFixed(3) + ' after ' + el.currentTime.toFixed(3) + ' s of playback, ' + mediaError(el));
  } catch (e) {
    result('media-element-source', false, String(e) + ' (' + mediaError(el) + ')');
  }
  el.pause();
  URL.revokeObjectURL(el.src);
}
// ?click: wait for a click first (desktop browsers start audio only after one).
const clicked = location.search.includes('click')
  ? new Promise(r => { say('click to start'); addEventListener('click', r, { once: true }); }) : Promise.resolve();
clicked.then(run).catch(e => say('RESULT webaudio summary FAIL ' + e));
</script>
