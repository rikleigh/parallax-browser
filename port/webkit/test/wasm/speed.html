<!doctype html>
<!-- How fast WebAssembly runs: a tight integer loop (multiply, xor, add per
     iteration) in a hand-assembled wasm module and the same loop in JS, run
     10 times so both tier up (wasm: IPInt, then BBQ, then OMG; JS: up to FTL).
     A wasm loop well behind the JS one, or ~10x behind what the console's
     CPU should do (about 1 ns per iteration compiled), means wasm stays in
     the interpreter. Log lines: RESULT wasm-speed run N wasm X ns/iter, js Y
     ns/iter, then RESULT wasm-speed best wasm X, js Y. Upload to
     /data/ps5webkit/wasm-speed.html and open file:///data/ps5webkit/wasm-speed.html. -->
<html>
<head>
<meta charset="utf-8">
<title>Wasm speed</title>
<style>
  body { background: #111; color: #eee; font: 22px/1.35 sans-serif; margin: 40px; }
  #out { white-space: pre; }
</style>
</head>
<body>
<h1>WebAssembly speed</h1>
<div id="out"></div>
<script>
const out = document.getElementById('out');
function say(line) {
  console.log(line);
  out.textContent += line + '\n';
}
// (func (export "run") (param $n i32) (result i32) (local $i i32) (local $s i32)
//   (loop (s = s + ((i * i) ^ s)) (i = i + 1) (br_if 0 (i < n))) s)
const bytes = new Uint8Array([
  0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00,
  0x01, 0x06, 0x01, 0x60, 0x01, 0x7f, 0x01, 0x7f,                   // type: (i32) -> i32
  0x03, 0x02, 0x01, 0x00,                                           // function 0: type 0
  0x07, 0x07, 0x01, 0x03, 0x72, 0x75, 0x6e, 0x00, 0x00,             // export "run"
  0x0a, 0x24, 0x01, 0x22,                                           // code: 1 body, 34 bytes
  0x01, 0x02, 0x7f,                                                 // locals: 2 x i32
  0x03, 0x40,                                                       // loop
  0x20, 0x02, 0x20, 0x01, 0x20, 0x01, 0x6c, 0x20, 0x02, 0x73, 0x6a, 0x21, 0x02,   // s = s + ((i*i) ^ s)
  0x20, 0x01, 0x41, 0x01, 0x6a, 0x22, 0x01, 0x20, 0x00, 0x48, 0x0d, 0x00,       // i++; br_if i < n
  0x0b,                                                             // end loop
  0x20, 0x02,                                                       // s
  0x0b,                                                             // end
]);
function jsRun(n) {
  let i = 0, s = 0;
  do { s = (s + (Math.imul(i, i) ^ s)) | 0; i = (i + 1) | 0; } while (i < n);
  return s;
}
const N = 50000000;
try {
  const { instance } = { instance: new WebAssembly.Instance(new WebAssembly.Module(bytes)) };
  const run = instance.exports.run;
  let bestWasm = Infinity, bestJS = Infinity, run_ = 0;
  function next() {
    run_++;
    let t = performance.now();
    const a = run(N);
    const wasmNs = (performance.now() - t) * 1e6 / N;
    t = performance.now();
    const b = jsRun(N);
    const jsNs = (performance.now() - t) * 1e6 / N;
    bestWasm = Math.min(bestWasm, wasmNs);
    bestJS = Math.min(bestJS, jsNs);
    say('RESULT wasm-speed run ' + run_ + ' wasm ' + wasmNs.toFixed(2) + ' ns/iter, js ' + jsNs.toFixed(2) + ' ns/iter' + (a === b ? '' : ' (results differ: ' + a + ' vs ' + b + ')'));
    if (run_ < 10)
      setTimeout(next, 200);
    else
      say('RESULT wasm-speed best wasm ' + bestWasm.toFixed(2) + ' ns/iter, js ' + bestJS.toFixed(2) + ' ns/iter');
  }
  next();
} catch (e) {
  say('RESULT wasm-speed FAIL ' + e);
}
</script>
</body>
</html>
