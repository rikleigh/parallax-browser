<!doctype html>
<!-- On-screen keyboard placement and titles. Open
     file:///data/ps5webkit/keyboard-placement.html and press X on each field:
     - the keyboard opens away from the field (at the bottom for the top
       form, at the top for the bottom form), so the field stays visible;
     - its title names the field: "Email address" (a <label>), "Your name"
       (aria-label), "Search the shop" (placeholder only), "Password" (label);
     - Go in a field moves to the next one in its form and the keyboard
       follows; Go in the last field submits (the page shows "submitted"). -->
<html>
<head>
<meta charset="utf-8">
<title>Keyboard placement</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { font: 28px sans-serif; background: #fff; color: #000; display: flex; flex-direction: column; justify-content: space-between; }
  form { margin: 24px 40px; }
  label { display: block; margin: 10px 0; }
  input { font-size: 28px; width: 420px; margin-left: 16px; }
  #out { margin: 0 40px; color: #060; }
</style>
</head>
<body>
<form id="top" onsubmit="event.preventDefault(); document.getElementById('out').textContent = 'top form submitted';">
  <label>Email address <input type="email" name="email"></label>
  <label>Password <input type="password" name="pw"></label>
</form>
<p id="out"></p>
<form id="bottom" onsubmit="event.preventDefault(); document.getElementById('out').textContent = 'bottom form submitted';">
  <input aria-label="Your name" name="n">
  <input placeholder="Search the shop" name="q">
</form>
</body>
</html>
