<!doctype html>
<!-- Password masking on the console: each field should show dots (•).
     Open file:///data/ps5webkit/password-dots.html (or list it in
     test-urls.txt with debug-screenshot on) and look: a field that shows
     nothing means its masking glyph is not drawn.
       1. value attribute            2. value set from script
       3. text inserted as the keyboard does (insertText into the focused field)
       4-6. the same with fonts a page might ask for: an unknown web font,
            system-ui, monospace
       7. a plain text field for comparison (shows "abcd") -->
<html>
<head>
<meta charset="utf-8">
<title>Password dots</title>
<style>
  body { font: 28px sans-serif; margin: 40px; background: #fff; color: #000; }
  label { display: block; margin: 14px 0; }
  input { font-size: 28px; width: 360px; margin-left: 16px; }
  #f4 { font-family: "SomeWebFontThatIsNotThere", sans-serif; }
  #f5 { font-family: system-ui; }
  #f6 { font-family: monospace; }
</style>
</head>
<body>
<label>1 attribute <input id="f1" type="password" value="abcd"></label>
<label>2 script <input id="f2" type="password"></label>
<label>3 insertText <input id="f3" type="password"></label>
<label>4 unknown font <input id="f4" type="password" value="abcd"></label>
<label>5 system-ui <input id="f5" type="password" value="abcd"></label>
<label>6 monospace <input id="f6" type="password" value="abcd"></label>
<label>7 text <input id="f7" type="text" value="abcd"></label>
<p id="out"></p>
<script>
document.getElementById('f2').value = 'abcd';
const f3 = document.getElementById('f3');
f3.focus();
document.execCommand('insertText', false, 'abcd');
f3.blur();
const lengths = ['f1', 'f2', 'f3', 'f4', 'f5', 'f6', 'f7'].map(id => id + '=' + document.getElementById(id).value.length);
document.getElementById('out').textContent = 'value lengths: ' + lengths.join(' ');
console.log('[password-dots] RESULT ' + lengths.join(' '));
</script>
</body>
</html>
