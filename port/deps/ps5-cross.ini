# Meson cross file: PS5 payloads (ps5-payload-sdk, x86_64-sie-ps5) against
# the WPE dependency sysroot in toolchain/wpe-sysroot.
#
#   meson setup build --cross-file port/deps/ps5-cross.ini
#
# Paths are relative to this file (@DIRNAME@), so the repo can live anywhere.
# C++ code is compiled against libc++ 19 (toolchain/libcxx19), the same
# libc++ WebKit uses (the SDK's libc++ 18 lacks std::atomic_ref).
# Libraries are static; executables are static-PIE payload ELFs.

[constants]
root    = '@DIRNAME@' / '..' / '..'
sdk     = root / 'toolchain' / 'ps5-payload-sdk'
sysroot = root / 'toolchain' / 'wpe-sysroot'
libcxx  = root / 'toolchain' / 'libcxx19' / 'install'
common  = ['-O2', '-g0', '-fPIC', '-ffunction-sections', '-fdata-sections',
           '-I' + sysroot / 'include']

[binaries]
c          = sdk / 'bin' / 'prospero-clang'
cpp        = sdk / 'bin' / 'prospero-clang++'
ar         = sdk / 'bin' / 'prospero-ar'
ranlib     = sdk / 'bin' / 'prospero-ranlib'
nm         = sdk / 'bin' / 'prospero-nm'
strip      = sdk / 'bin' / 'prospero-strip'
objcopy    = sdk / 'bin' / 'prospero-objcopy'
pkg-config = '@DIRNAME@' / 'pkg-config-ps5'
cmake      = 'cmake'

[built-in options]
c_args         = common
cpp_args       = common + ['-nostdinc++', '-isystem', libcxx / 'include' / 'c++' / 'v1']
c_link_args    = ['-L' + sysroot / 'lib', '-Wl,--gc-sections']
cpp_link_args  = ['-L' + sysroot / 'lib', '-Wl,--gc-sections', '-nostdlib++',
                  libcxx / 'lib' / 'libc++.a', libcxx / 'lib' / 'libc++abi.a', libcxx / 'lib' / 'libunwind.a']
default_library = 'static'
b_staticpic    = true

[properties]
needs_exe_wrapper = true
pkg_config_libdir = [sysroot / 'lib' / 'pkgconfig', sysroot / 'share' / 'pkgconfig']
cmake_toolchain_file = '@DIRNAME@' / 'ps5-wpe.cmake'

[host_machine]
system     = 'freebsd'
cpu_family = 'x86_64'
cpu        = 'x86_64'
endian     = 'little'
