<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Fontconfig configuration for WPE on PS5 payloads.

     The font directory is relative to this file (prefix="relative"), so the
     fonts follow the config wherever <root>/etc/fonts/fonts.conf and
     <root>/fonts live. fontconfig has no "relative" form for <cachedir>, so
     the cache path is absolute: change it if the tree moves (a missing or
     read-only cache only costs a font scan at startup).
     libfontconfig in the sysroot looks for /data/ps5webkit/etc/fonts/fonts.conf
     by default; FONTCONFIG_FILE overrides that. -->
<fontconfig>
  <dir prefix="relative">../../fonts</dir>
  <cachedir>/data/ps5webkit/cache/fontconfig</cachedir>

  <!-- Generic families -> Noto. Other scripts, CJK, symbols and emoji follow
       as fallbacks (Noto Color Emoji is CBDT: colour bitmaps via FreeType+libpng). -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans Arabic</family>
      <family>Noto Sans Hebrew</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Sans Bengali</family>
      <family>Noto Sans Tamil</family>
      <family>Noto Sans Thai</family>
      <family>Noto Sans Armenian</family>
      <family>Noto Sans Georgian</family>
      <family>Noto Sans Ethiopic</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK KR</family>
      <family>Noto Sans Symbols</family>
      <family>Noto Sans Symbols 2</family>
      <family>Noto Sans Math</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans Arabic</family>
      <family>Noto Sans Hebrew</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Sans Bengali</family>
      <family>Noto Sans Tamil</family>
      <family>Noto Sans Thai</family>
      <family>Noto Sans Armenian</family>
      <family>Noto Sans Georgian</family>
      <family>Noto Sans Ethiopic</family>
      <family>Noto Sans Symbols</family>
      <family>Noto Sans Symbols 2</family>
      <family>Noto Sans Math</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Mono CJK JP</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>Noto Sans Symbols</family>
      <family>Noto Sans Symbols 2</family>
      <family>Noto Sans Math</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="same"><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="same"><family>Apple Color Emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="same"><family>system-ui</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>cursive</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias binding="same"><family>fantasy</family><prefer><family>Noto Sans</family></prefer></alias>

  <!-- Common web font names mapped to metric-similar shipped faces. -->
  <alias binding="same"><family>Arial</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Roboto</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Times New Roman</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias binding="same"><family>Times</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias binding="same"><family>Courier New</family><prefer><family>Noto Sans Mono</family></prefer></alias>
  <alias binding="same"><family>Courier</family><prefer><family>Noto Sans Mono</family></prefer></alias>

  <!-- Unknown families fall back to sans-serif. -->
  <match target="pattern">
    <test qual="all" name="family" compare="not_eq"><string>sans-serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>monospace</string></test>
    <edit name="family" mode="append_last"><string>sans-serif</string></edit>
  </match>

  <!-- Rendering defaults for a TV: grayscale AA, slight hinting. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
